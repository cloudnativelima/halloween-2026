---
apiVersion: v1
kind: Namespace
metadata:
  name: possessed-sa
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-agent
  namespace: possessed-sa
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: support-agent
  namespace: possessed-sa
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: possession-observer
  namespace: possessed-sa
automountServiceAccountToken: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-ledger
  namespace: possessed-sa
data:
  record: audit-only
  support_archival_note: fictional-support-value
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: restricted-ledger
  namespace: possessed-sa
data:
  note: not-for-audit-agent
---
apiVersion: v1
kind: Secret
metadata:
  name: support-secret
  namespace: possessed-sa
type: Opaque
stringData:
  payload: fictional-support-value
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: audit-ledger-reader
  namespace: possessed-sa
rules:
- apiGroups:
  - ''
  resources:
  - configmaps
  resourceNames:
  - audit-ledger
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: audit-ledger-reader
  namespace: possessed-sa
subjects:
- kind: ServiceAccount
  name: audit-agent
  namespace: possessed-sa
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: audit-ledger-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: support-secret-reader
  namespace: possessed-sa
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - support-secret
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: support-secret-reader
  namespace: possessed-sa
subjects:
- kind: Group
  name: system:serviceaccounts:possessed-sa
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: support-secret-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: possession-audit
  namespace: possessed-sa
rules:
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - roles
  - rolebindings
  verbs:
  - get
  - list
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - list
- apiGroups:
  - apps
  resources:
  - deployments
  resourceNames:
  - audit-agent
  - support-agent
  - possession-observer
  verbs:
  - get
- apiGroups:
  - ''
  resources:
  - configmaps
  resourceNames:
  - audit-ledger
  verbs:
  - get
- apiGroups:
  - ''
  resources:
  - services
  resourceNames:
  - support-agent
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: possession-audit
  namespace: possessed-sa
subjects:
- kind: ServiceAccount
  name: possession-observer
  namespace: possessed-sa
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: possession-audit
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: legacy-observer
  namespace: possessed-sa
rules:
- apiGroups:
  - ''
  resources:
  - configmaps
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: legacy-telemetry
  namespace: possessed-sa
subjects:
- kind: ServiceAccount
  name: audit-agent
  namespace: possessed-sa
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: legacy-observer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forgotten-support-delegation
  namespace: possessed-sa
subjects:
- kind: ServiceAccount
  name: audit-agent
  namespace: possessed-sa
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: support-secret-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: support-emergency-access
  namespace: possessed-sa
subjects:
- kind: Group
  name: system:authenticated
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: support-secret-reader
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-agent
  namespace: possessed-sa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit-agent
  template:
    metadata:
      labels:
        app: audit-agent
    spec:
      serviceAccountName: support-agent
      automountServiceAccountToken: true
      containers:
      - name: audit-agent
        image: ghcr.io/cloudnativelima/kubectl-exorcise-2026:v1
        imagePullPolicy: IfNotPresent
        args:
        - audit-agent
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 25m
            memory: 48Mi
          limits:
            cpu: 150m
            memory: 128Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
        volumeMounts:
        - name: archived-support-data
          mountPath: /var/run/archived-support
          readOnly: true
        - name: forgotten-handoff
          mountPath: /var/run/audit-handoff
          readOnly: true
        env:
        - name: ARCHIVED_SUPPORT_PAYLOAD
          valueFrom:
            secretKeyRef:
              name: support-secret
              key: payload
      volumes:
      - name: archived-support-data
        projected:
          sources:
          - secret:
              name: support-secret
              items:
              - key: payload
                path: archive.dat
      - name: forgotten-handoff
        emptyDir: {}
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
      - name: support-archivist
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        args:
        - printf "%s" "$ARCHIVED_SUPPORT_PAYLOAD" > /handoff/record
        env:
        - name: ARCHIVED_SUPPORT_PAYLOAD
          valueFrom:
            secretKeyRef:
              name: support-secret
              key: payload
        volumeMounts:
        - name: forgotten-handoff
          mountPath: /handoff
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
          limits:
            cpu: 50m
            memory: 32Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-agent
  namespace: possessed-sa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: support-agent
  template:
    metadata:
      labels:
        app: support-agent
    spec:
      serviceAccountName: audit-agent
      automountServiceAccountToken: false
      containers:
      - name: support-agent
        image: ghcr.io/cloudnativelima/kubectl-exorcise-2026:v1
        imagePullPolicy: IfNotPresent
        args:
        - support-agent
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 25m
            memory: 48Mi
          limits:
            cpu: 150m
            memory: 128Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: support-agent
  namespace: possessed-sa
spec:
  type: ClusterIP
  selector:
    app: support-agent
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: possession-observer
  namespace: possessed-sa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: possession-observer
  template:
    metadata:
      labels:
        app: possession-observer
    spec:
      serviceAccountName: possession-observer
      automountServiceAccountToken: true
      containers:
      - name: possession-observer
        image: ghcr.io/cloudnativelima/kubectl-exorcise-2026:v1
        imagePullPolicy: IfNotPresent
        args:
        - possession-auditor
        ports:
        - name: health
          containerPort: 8081
        resources:
          requests:
            cpu: 25m
            memory: 48Mi
          limits:
            cpu: 150m
            memory: 128Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        readinessProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 5
